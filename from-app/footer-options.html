<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页脚四套 · 文风字体</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/from-app/css/fonts.css?v=20260925r" />
  <link rel="stylesheet" href="/from-app/css/tokens.css?v=20260925r" />
  <link rel="stylesheet" href="/from-app/css/base.css?v=20260925r" />
  <link rel="stylesheet" href="/from-app/css/components.css?v=20260925r" />
  <link rel="stylesheet" href="/from-app/css/site.css?v=20260925r" />
  <link rel="stylesheet" href="/from-app/css/footer-options.css?v=20260925r" />
  <link rel="icon" type="image/webp" href="/from-app/assets/icon.webp" />
</head>
<body class="page-foot-opt">
  <header data-topbar data-active="home"></header>

  <div class="fo-switch">
    <div class="container fo-switch-inner">
      <p class="fo-switch-lead">只改页脚。上面是首页库内结构的收口。现站页脚未换版，只改了墨图云集和年份。</p>
      <nav class="seg-glyph" aria-label="设计稿">
        <a href="#a">甲 一行</a>
        <a href="#b">乙 两行</a>
        <a href="#c">丙 落款</a>
        <a href="#d">丁 字号</a>
      </nav>
      <a class="fo-back" href="/">回现首页</a>
    </div>
  </div>

  <main>
    <p class="fo-note" id="foNote"></p>
    <section class="stats-band fo-stub" aria-hidden="true">
      <div class="container">
        <div class="section-head"><h2>库内结构</h2></div>
        <div class="stats-grid">
          <div class="stat-panel">
            <h3>按授权</h3>
            <div class="stat-row"><span class="lab">免费商用</span><span class="track"><i style="width:72%"></i></span><span class="num">146</span></div>
            <div class="stat-row"><span class="lab">需授权</span><span class="track"><i style="width:18%"></i></span><span class="num">36</span></div>
            <div class="stat-row"><span class="lab">个人免费</span><span class="track"><i style="width:8%"></i></span><span class="num">16</span></div>
          </div>
          <div class="stat-panel">
            <h3>厂商 TOP6</h3>
            <div class="stat-row"><span class="lab">阿里巴巴</span><span class="track"><i style="width:64%"></i></span><span class="num">12</span></div>
            <div class="stat-row"><span class="lab">思源</span><span class="track"><i style="width:48%"></i></span><span class="num">9</span></div>
            <div class="stat-row"><span class="lab">站酷</span><span class="track"><i style="width:36%"></i></span><span class="num">7</span></div>
          </div>
          <div class="stat-panel">
            <h3>字符规模</h3>
            <div class="stat-row"><span class="lab">7 千–1 万</span><span class="track"><i style="width:58%"></i></span><span class="num">88</span></div>
            <div class="stat-row"><span class="lab">3 千–7 千</span><span class="track"><i style="width:40%"></i></span><span class="num">61</span></div>
            <div class="stat-row"><span class="lab">1 万以上</span><span class="track"><i style="width:28%"></i></span><span class="num">42</span></div>
          </div>
        </div>
      </div>
    </section>

    <article class="fo-block is-on" id="a"><footer class="fo fo-a" id="footA"></footer></article>
    <article class="fo-block" id="b"><footer class="fo fo-b" id="footB"></footer></article>
    <article class="fo-block" id="c"><footer class="fo fo-c" id="footC"></footer></article>
    <article class="fo-block" id="d"><footer class="fo fo-d" id="footD"></footer></article>
  </main>

  <script src="/from-app/js/wf-proto.js?v=20260925r"></script>
  <script src="/from-app/js/wf-chrome.js?v=20260925r"></script>
  <script src="/from-app/js/pages/footer-options.js?v=20260925r"></script>
</body>
</html>
